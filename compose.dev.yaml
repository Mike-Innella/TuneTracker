# Development overrides: hot-reloading `next dev` with the source bind-mounted.
# docker compose -f compose.yaml -f compose.dev.yaml up --build -d
services:
  migrate:
    build:
      target: dev
  app:
    build:
      target: dev
    working_dir: /app/frontend
    command: ['npx', 'next', 'dev', '--hostname', '0.0.0.0']
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
      - ./packages/shared:/app/packages/shared
      - ./data/prisma:/app/data/prisma
      - ./data/src/db.ts:/app/data/src/db.ts
      - /app/frontend/.next
