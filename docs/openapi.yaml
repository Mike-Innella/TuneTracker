  /uploads/{storagePath}:
    get:
      tags: [Uploads]
      summary: Resolve uploaded audio path
      description: |
        `storagePath` is the URL-encoded object key (can include `/` segments).
        Behavior depends on storage mode:
        - `STORAGE_DRIVER=local`: API serves file content directly.
        - `STORAGE_DRIVER=s3`: API returns `302` redirect to a signed S3 URL unless `AWS_S3_PUBLIC_BASE_URL` is configured.
      parameters:
        - in: path
          name: storagePath
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local file served
        "302":
          description: Redirect to signed/public S3 object URL
        "404":
          $ref: "#/components/responses/NotFound"
