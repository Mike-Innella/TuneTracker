name: Feature request
description: Suggest an improvement for music creatives
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow (e.g. "When I'm comping vocals I need…")
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
