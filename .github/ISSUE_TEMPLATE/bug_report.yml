name: Bug report
description: Something in TuneTracker isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a project board\n2. Drag a task to…"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device
      placeholder: Chrome 140 on macOS, Safari on iPhone 15…
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Auth, Dashboard, Projects, Kanban board, Community, Audio, Profiles, Settings, Other]
