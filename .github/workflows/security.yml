name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scanning (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact

  filesystem:
    name: Trivy filesystem scan (deps + misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy fs
        run: >-
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.1
          fs --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln,misconfig --skip-dirs /src/legacy --no-progress /src
