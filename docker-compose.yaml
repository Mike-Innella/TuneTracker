name: tunetracker

services:
  mysql:
    image: mysql:8.0
    container_name: tunetracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tunetracker
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uappuser -papppassword --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./server
    image: tunetracker-api:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://appuser:apppassword@mysql:3306/tunetracker
      MIGRATE_DATABASE_URL: mysql://root:rootpassword@mysql:3306/tunetracker
      JWT_SECRET: change-me-before-production
      CLIENT_ORIGIN: http://localhost:8080
      PORT: 4000
    volumes:
      - api_uploads:/app/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  web:
    build:
      context: ./client
    image: tunetracker-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
  api_uploads:
