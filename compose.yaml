# Portable stack: Postgres + one-shot migrations + production Next.js image.
# Supabase Auth/Storage come from the Supabase CLI stack (`npm run supabase:start`)
# or a hosted Supabase project — see docs/development/docker.md.
name: tunetracker2

x-app-env: &app-env
  DATABASE_URL: postgresql://tunetracker:tunetracker@db:5432/tunetracker
  DIRECT_URL: postgresql://tunetracker:tunetracker@db:5432/tunetracker
  # Browser-facing Supabase URL vs. the URL the server uses from inside Docker.
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?run `npx supabase status --workdir data` and copy the keys into .env}
  SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  RATE_LIMIT_SCALE: ${RATE_LIMIT_SCALE:-1}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tunetracker
      POSTGRES_PASSWORD: tunetracker
      POSTGRES_DB: tunetracker
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tunetracker -d tunetracker']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: builder
    working_dir: /app
    command: ['npm', 'run', 'db:deploy']
    environment: *app-env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment: *app-env
    init: true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
